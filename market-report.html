<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubHouse - Market Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="comp-map.js?v=9" defer></script>
<style>
  @font-face { font-family: "Pragmatica"; src: url("assets/fonts/Pragmatica-Book.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Pragmatica"; src: url("assets/fonts/Pragmatica-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Mencken Std"; src: url("assets/fonts/MenckenStd-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }

  :root {
    --slate: #2b2825; --slate-70: #5a544f; --slate-50: #837c75;
    --slate-30: #b6b1ab; --everest: #16352e; --birch: #a95818;
    --beige: #f7f1e3; --beige-deep: #ede5cf; --lime: #c1d100;
    --warn: #c79830; --good-soft: #d8e3df; --bad-soft: #f0d9c4; --blue: #3d8aa6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pragmatica", -apple-system, "Segoe UI", sans-serif;
    font-size: 10.5px; color: var(--slate); background: #d8d4ce;
    font-variant-numeric: tabular-nums; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet {
    width: 8.5in; min-height: 11in; margin: 18px auto; padding: 0.55in 0.6in;
    background: #fff; box-shadow: 0 4px 18px rgba(43, 40, 37, 0.25);
    display: flex; flex-direction: column;
  }
  @page { size: letter; margin: 0; }
  @media print {
    body { background: #fff; }
    .sheet { margin: 0; box-shadow: none; page-break-after: always; min-height: 0; height: 10.98in; overflow: hidden; }
    .sheet:last-of-type { page-break-after: avoid; }
    .print-btn, #report-loading { display: none !important; }
  }
  .print-btn { position: fixed; top: 14px; right: 16px; z-index: 10; background: var(--everest); color: #fff; border: none; border-radius: 999px; padding: 10px 20px; font: 700 13px "Pragmatica", sans-serif; cursor: pointer; box-shadow: 0 3px 10px rgba(43, 40, 37, 0.35); }
  .print-btn:hover { background: var(--slate); }

  /* Compact running header (top of every sheet) */
  .run-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--slate-50); border-bottom: 1px solid var(--beige-deep); padding-bottom: 5px; margin-bottom: 12px; }
  .run-head b { color: var(--birch); }

  /* Large main-section header */
  .main-head { display: flex; align-items: flex-end; gap: 12px; border-bottom: 3px solid var(--everest); padding-bottom: 8px; margin-bottom: 16px; }
  .main-head .num { font-family: "Mencken Std", Georgia, serif; font-size: 34px; font-weight: 700; line-height: 0.9; color: var(--birch); }
  .main-head .ttl { font-family: "Mencken Std", Georgia, serif; font-size: 30px; font-weight: 700; line-height: 0.95; letter-spacing: -0.015em; color: var(--everest); }
  .main-head .ttl small { display: block; font-family: "Pragmatica", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; color: var(--slate-70); margin-top: 3px; }
  .main-head .meta { margin-left: auto; text-align: right; font-size: 9px; color: var(--slate-50); }
  .main-head .meta .chip { display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: 8.5px; font-weight: 700; margin-left: 4px; }
  .chip-s30 { background: var(--lime); color: var(--slate); }
  .chip-rank { background: var(--beige-deep); color: var(--slate-70); }

  /* Title page hero */
  .hero { display: flex; flex-direction: column; }
  .hero .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--birch); }
  .hero .name { font-family: "Mencken Std", Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1.02; letter-spacing: -0.015em; margin-top: 4px; }
  .hero .loc { font-size: 13px; color: var(--slate-70); margin-top: 4px; }

  /* Subsection label */
  .sub { font-family: "Mencken Std", Georgia, serif; font-size: 13px; font-weight: 700; color: var(--everest); margin: 15px 0 8px; }
  .sub:first-child { margin-top: 0; }

  /* KPI grid */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .kpi { background: var(--beige); border: 1px solid var(--beige-deep); border-radius: 6px; padding: 8px 10px; }
  .kpi-label { font-size: 7.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate-50); }
  .kpi-value { font-size: 17px; font-weight: 700; margin-top: 3px; }
  .kpi-sub { font-size: 8px; color: var(--slate-50); margin-top: 2px; }
  .kpi-up { color: var(--everest); } .kpi-down { color: var(--birch); }

  /* Qualifier scorecard */
  .qual-wrap { display: flex; gap: 14px; align-items: stretch; }
  .qual-score { flex: 0 0 120px; background: var(--everest); color: #fff; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  .qual-score .pct { font-family: "Mencken Std", Georgia, serif; font-size: 34px; font-weight: 700; }
  .qual-score .lbl { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; text-align: center; margin-top: 4px; }
  .qual-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; }
  .qual-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--beige-deep); font-size: 9.5px; }
  .qual-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-right: 7px; }
  .dot-pass { background: var(--everest); } .dot-fail { background: var(--birch); } .dot-warn { background: var(--warn); } .dot-na { background: var(--slate-30); }
  .qual-row .ql { flex: 1; display: flex; align-items: center; color: var(--slate-70); }
  .qual-row .qv { font-weight: 700; white-space: nowrap; }

  /* Forward ranking */
  .fwd-wrap { display: flex; gap: 14px; align-items: stretch; }
  .fwd-score { flex: 0 0 140px; background: var(--beige-deep); border: 1px solid var(--slate-30); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  .fwd-score .rk { font-family: "Mencken Std", Georgia, serif; font-size: 34px; font-weight: 700; color: var(--everest); }
  .fwd-score .lbl { font-size: 8px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--slate-70); text-align: center; margin-top: 4px; }
  .fwd-drivers { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* Charts */
  .chart-card { border: 1px solid var(--beige-deep); border-radius: 6px; padding: 9px 11px 7px; }
  .chart-card h4 { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--slate-70); margin-bottom: 5px; }
  .chart-box { position: relative; height: 140px; }
  .chart-box-tall { position: relative; height: 178px; }
  .chart-box-sm { position: relative; height: 120px; }
  .charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .charts3 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; align-items: stretch; }
  .perf-grid { display: grid; grid-template-columns: 1fr; gap: 11px; }
  .perf-cell { border: 1px solid var(--beige-deep); border-radius: 6px; padding: 7px 12px 6px; }
  .perf-cell h4 { font-size: 9.5px; font-weight: 700; color: var(--everest); margin-bottom: 3px; }
  .perf-cell .perf-box { position: relative; height: 158px; }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 9px; color: var(--slate-70); margin: 0 0 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

  /* Generated comp-map PNG only - no frame, background or letterboxing */
  .map-img { display: block; width: auto; max-width: 100%; max-height: 4.3in; margin: 0 auto; }
  .map-img-sm { max-height: 3.4in; }

  .pipe-band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .charts-pipe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .charts-pipe > .chart-card { min-width: 0; }
  .charts-pipe canvas { max-width: 100%; }
  .charts-sd { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .charts-sd > .chart-card { min-width: 0; }
  .charts-sd canvas { max-width: 100%; }
  .chart-box-bar { position: relative; height: 92px; }

  /* Profile mini-table */
  .prof-table { width: 100%; border-collapse: collapse; font-size: 9.5px; }
  .prof-table td { padding: 5px 7px; border-bottom: 1px solid var(--beige-deep); }
  .prof-table td.lbl { font-weight: 700; color: var(--slate); }
  .prof-table td.val { text-align: right; color: var(--slate-70); }
  .prof-table td.tgt { text-align: right; font-weight: 700; width: 46px; }
  .tgt-met { color: var(--slate); } .tgt-miss { color: var(--birch); } .tgt-na { color: var(--slate-50); font-weight: 600; }

  /* Data tables */
  table.dt { width: 100%; border-collapse: collapse; font-size: 9px; }
  table.dt thead th { background: var(--everest); color: #fff; font-weight: 700; padding: 6px 8px; text-align: right; font-size: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
  table.dt thead th:first-child { text-align: left; }
  table.dt tbody td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--beige-deep); color: var(--slate-70); }
  table.dt tbody td:first-child { text-align: left; font-weight: 700; color: var(--slate); }
  table.dt tbody tr:nth-child(even) td { background: var(--beige); }
  table.dt tfoot td { padding: 6px 8px; text-align: right; font-weight: 700; border-top: 2px solid var(--slate); background: var(--beige-deep); }
  table.dt tfoot td:first-child { text-align: left; }
  /* Secondary growth rows (YoY / 2-Yr / 3-Yr) under the bold aggregate row */
  table.dt tfoot tr.gr td { background: #fff; font-weight: 700; color: var(--slate-70); border-top: 1px solid var(--beige-deep); }
  table.dt td.up { color: var(--everest); }
  table.dt td.down { color: var(--birch); }
  /* Unit Mix sits full-page beneath the comp table but keeps a readable width */
  .umix-wrap { max-width: 3.6in; }

  .two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
  .foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--beige-deep); display: flex; justify-content: space-between; font-size: 8px; color: var(--slate-50); }
  #report-loading { text-align: center; padding: 60px; color: var(--slate-70); font-size: 14px; }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
<div id="report-loading">Building market report…</div>
<div id="report-root"></div>
<canvas id="comp-map-canvas" width="2800" height="2000" style="position:absolute; left:-99999px; top:0;"></canvas>

<script>
"use strict";

const POWER4_ANCHORS = new Set([
  "University of Alabama","University of Arkansas","Auburn University","University of Florida","University of Georgia","University of Kentucky","Louisiana State University","Mississippi State University","University of Mississippi","University of Missouri","University of Oklahoma","University of South Carolina","University of Tennessee","Texas A&M University","University of Texas at Austin","Vanderbilt University",
  "University of Illinois at Urbana-Champaign","Indiana University Bloomington","University of Iowa","University of Maryland College Park","University of Michigan","Michigan State University","University of Minnesota Twin Cities","University of Nebraska Lincoln","Northwestern University","Ohio State University","University of Oregon","Penn State","Purdue University","Rutgers University","University of Southern California","University of Washington","University of Wisconsin Madison",
  "University of Arizona","Arizona State University","Baylor University","Brigham Young University","University of Cincinnati","University of Colorado Boulder","University of Houston","Iowa State University","University of Kansas","Kansas State University","Oklahoma State University","Texas Christian University","Texas Tech University","University of Central Florida","University of Utah","West Virginia University",
  "University of California Berkeley","Clemson University","Duke University","Florida State University","Georgia Institute of Technology","University of Louisville","North Carolina State University","University of North Carolina at Chapel Hill","University of Notre Dame","University of Pittsburgh","Southern Methodist University","Stanford University","Syracuse University","University of Virginia","Virginia Polytechnic Institute and State University","Wake Forest University",
]);

const C = { slate: "#2b2825", slate70: "#5a544f", slate30: "#b6b1ab", everest: "#16352e", birch: "#a95818", lime: "#c1d100", warn: "#c79830", blue: "#3d8aa6" };
const PERF = { anchor: C.birch, bench: C.everest, power4: C.blue };
const fmtInt = (v) => v == null ? "-" : Math.round(v).toLocaleString("en-US");
const fmtUsd = (v) => v == null || v === 0 ? "-" : "$" + Math.round(v).toLocaleString("en-US");
const fmtPct1 = (v) => v == null ? "-" : (v * 100).toFixed(1) + "%";
const fmtPct0 = (v) => v == null ? "-" : Math.round(v * 100) + "%";
const fmtSigned = (v) => v == null ? "-" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nz = (v) => v == null || v === 0 || isNaN(v) ? null : v;
const cleanZero = (v) => (v == null || v === 0) ? null : Number(v);

document.addEventListener("DOMContentLoaded", async () => {
  const marketKey = Number(new URLSearchParams(location.search).get("id"));
  if (!marketKey) return fail("No market specified - open this page from a market's Report button.");
  let DATA;
  try { const res = await fetch("data.json", { cache: "no-cache" }); if (!res.ok) throw new Error("HTTP " + res.status); DATA = await res.json(); }
  catch (e) { return fail("Couldn't load data.json - " + e); }

  const T = DATA.tables;
  const M = T.scorecard.find((r) => r.market_key === marketKey);
  if (!M) return fail("Market " + marketKey + " not found.");
  document.title = "SubHouse - " + M.anchor_university + " Market Report";

  const quals = (T.market_qualifiers || []).find((r) => r.market_key === marketKey);
  const history = (T.market_history || []).filter((r) => r.market_key === marketKey).sort((a, b) => a.year_ - b.year_);
  const histYears = history.map((r) => r.year_);
  const aff = (T.market_affluence || []).find((r) => r.market_key === marketKey);
  const props = (T.properties || []).filter((p) => p.market_key === marketKey);
  // Comps reflect the live dashboard selection when passed via ?comps=<keys>
  // (present even if empty); otherwise fall back to the standard comp set.
  const reportParams = new URLSearchParams(location.search);
  const selKeys = reportParams.has("comps")
    ? new Set(reportParams.get("comps").split(",").map(Number).filter((n) => !Number.isNaN(n)))
    : null;
  const comps = (selKeys ? props.filter((p) => selKeys.has(p.property_key)) : props.filter((p) => p.is_comp_set))
    .sort((a, b) => (b.yearBuilt ?? -1) - (a.yearBuilt ?? -1));
  const propHist = T.property_history || [];

  // Benchmark market sets
  const s30Keys = new Set(T.scorecard.filter((r) => r.is_subtext30).map((r) => r.market_key));
  const p4Keys = new Set(T.scorecard.filter((r) => POWER4_ANCHORS.has(r.anchor_university)).map((r) => r.market_key));
  const allHist = T.market_history || [];
  function yearMean(keys, field) {
    const byYear = {};
    allHist.forEach((r) => { if (!keys.has(r.market_key)) return; const v = cleanZero(r[field]); if (v == null) return; (byYear[r.year_] = byYear[r.year_] || []).push(v); });
    return histYears.map((y) => { const xs = byYear[y] || []; return xs.length ? xs.reduce((s, v) => s + v, 0) / xs.length : null; });
  }
  // "This market" at a distance/vintage scope (bed-weighted property_history)
  function scopeSeries(field, scope) {
    if (scope === "market") return history.map((r) => cleanZero(r[field]));
    const lim = scope === "0.5mi" ? 0.5 : 1;
    const minYear = scope === "1mi2015" ? 2015 : 0;
    const keys = new Set(props.filter((p) => p.milesToClosestCampus != null && p.milesToClosestCampus <= lim && (minYear === 0 || (p.yearBuilt || 0) >= minYear)).map((p) => p.property_key));
    const byYear = {};
    propHist.forEach((r) => { if (!keys.has(r.property_key)) return; const v = cleanZero(r[field]); const w = r.beds || 0; if (v == null || w <= 0) return; const e = byYear[r.year_] || (byYear[r.year_] = { s: 0, w: 0 }); e.s += v * w; e.w += w; });
    return histYears.map((y) => { const e = byYear[y]; return e && e.w > 0 ? e.s / e.w : null; });
  }
  const s30Mean = {}, p4Mean = {};
  ["avg_rent_per_bed", "occupancy", "prelease"].forEach((f) => { s30Mean[f] = yearMean(s30Keys, f); p4Mean[f] = yearMean(p4Keys, f); });

  // Anchor enrollment (largest school)
  const ehAll = (T.enrollment_history || []).filter((r) => r.market_key === marketKey);
  const byIpeds = {}; ehAll.forEach((r) => (byIpeds[r.ipeds_id] = byIpeds[r.ipeds_id] || []).push(r));
  let anchorRows = [], best = -1;
  Object.values(byIpeds).forEach((rows) => { const latest = rows.reduce((a, b) => (a.year_ > b.year_ ? a : b)); if ((latest.total_enrollment || 0) > best) { best = latest.total_enrollment || 0; anchorRows = rows; } });
  anchorRows.sort((a, b) => a.year_ - b.year_);
  const anchorIpeds = anchorRows.length ? anchorRows[0].ipeds_id : null;
  const anchorName = anchorRows.length ? anchorRows[0].university_name : M.anchor_university;
  const adm = (T.admissions_history || []).filter((r) => r.ipeds_id === anchorIpeds).sort((a, b) => a.year_ - b.year_);
  const uiRows = (T.university_info || []).filter((r) => r.market_key === marketKey);
  const uinfo = uiRows.find((r) => r.university_name === anchorName) || uiRows.slice().sort((a, b) => (b.enrollment_total || 0) - (a.enrollment_total || 0))[0] || null;

  // Comp unit mix by exact unit type
  const umByProp = {}; (T.unit_mix || []).forEach((r) => { umByProp[r.property_key] = r; });
  const utypeMeta = new Map(), utypeUnits = {};
  comps.forEach((p) => { const m = umByProp[p.property_key]; if (!m) return; (m.mix_by_unit_type || []).forEach((e) => { if (!utypeMeta.has(e.label)) utypeMeta.set(e.label, { b: e.beds_sort, ba: e.baths }); utypeUnits[e.label] = (utypeUnits[e.label] || 0) + (e.units || 0); }); });
  const utypes = [...utypeMeta.keys()].sort((a, b) => { const A = utypeMeta.get(a), B = utypeMeta.get(b); return (A.b - B.b) || ((A.ba ?? -1) - (B.ba ?? -1)); });
  const utypeTotal = utypes.reduce((s, t) => s + utypeUnits[t], 0);

  // Derived metrics
  const rankN = T.scorecard.filter((r) => r.fwd_rank != null).length;
  const topPct = M.fwd_rank != null && rankN ? Math.max(1, Math.round((M.fwd_rank / rankN) * 100)) : null;
  const last = history[history.length - 1], prev = history[history.length - 2];
  const rentYoy = last && prev && prev.avg_rent_per_bed > 0 ? last.avg_rent_per_bed / prev.avg_rent_per_bed - 1 : null;
  const eF = anchorRows[0], eL = anchorRows[anchorRows.length - 1];
  const enrCagr = eF && eL && eF.total_enrollment > 0 && eL.year_ > eF.year_ ? Math.pow(eL.total_enrollment / eF.total_enrollment, 1 / (eL.year_ - eF.year_)) - 1 : null;
  const pipePct = M.existing_beds > 0 ? M.beds_pipeline_total / M.existing_beds : null;
  const asOf = M.data_as_of ? new Date(M.data_as_of) : new Date();
  const asOfText = asOf.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  /* ---- Supply pipeline detail (mirrors the dashboard Pipeline tab) ---- */
  const PIPE_PHASE_LABEL = { "planned": "Planned", "under construction": "Under Construction", "lease up": "Lease Up", "stable": "Stabilized" };
  const SD_EXISTING = new Set(["stable", "lease up"]);          // delivered / leasing
  const SD_PIPELINE = new Set(["under construction", "planned"]); // not yet delivered
  const inScope = (p, lim, minYear) =>
    (lim == null || (p.milesToClosestCampus != null && p.milesToClosestCampus <= lim))
    && (p.yearBuilt || 0) >= (minYear || 0);
  const bedsBy = (phases, lim, minYear) => props
    .filter((p) => phases.has(p.phase) && inScope(p, lim, minYear))
    .reduce((s, p) => s + (p.beds || 0), 0);

  // Doughnut: pipeline beds by phase, per proximity band
  const PIPE_BANDS = [
    { id: "market", l: "Total Market", lim: null },
    { id: "1mi", l: "Within 1 Mile", lim: 1.0 },
    { id: "05mi", l: "Within ½ Mile", lim: 0.5 },
  ];
  const pipeDoughnut = (lim) => ({
    lu: bedsBy(new Set(["lease up"]), lim, 0),
    uc: bedsBy(new Set(["under construction"]), lim, 0),
    planned: bedsBy(new Set(["planned"]), lim, 0),
  });

  // New Projects table (pipeline phases), market-wide, by completion then beds
  const PIPE_PHASES = new Set(["under construction", "lease up", "planned"]);
  const PIPE_ROW_CAP = 13;
  const pipeProjects = props
    .filter((p) => PIPE_PHASES.has(p.phase))
    .sort((a, b) => (a.yearBuilt || 9999) - (b.yearBuilt || 9999) || (b.beds || 0) - (a.beds || 0));
  const pipeProjBeds = pipeProjects.reduce((s, p) => s + (p.beds || 0), 0);

  // Deliveries by year built: Delivered (stabilized + lease-up) vs Projected (UC + planned)
  const delivByYear = {};
  props.forEach((p) => {
    const y = p.yearBuilt, b = p.beds || 0; if (!y || !b) return;
    const e = delivByYear[y] || (delivByYear[y] = { d: 0, p: 0 });
    if (SD_EXISTING.has(p.phase)) e.d += b; else if (SD_PIPELINE.has(p.phase)) e.p += b;
  });
  const delivYears = Object.keys(delivByYear).map(Number).sort((a, b) => a - b);

  // Uncaptured demand by proximity band: (on-campus + existing + pipeline) vs FTE
  const onCampusBeds = uiRows.reduce((s, r) => s + (r.beds_on_campus_reported || r.beds_on_campus_computed || 0), 0);
  const fteDemand = M.enr_full_time || null;
  const SD_SCOPES = [
    { id: "market", l: "Total Market", lim: null, minYear: 0 },

    { id: "05mi", l: "Within ½ Mile", lim: 0.5, minYear: 0 },

  const sdCols = SD_SCOPES.map((sc) => {

  /* ---- shared bits ---- */
  const TOTAL = 12;
  const runHead = `<div class="run-head"><span>Subtext Living · Market Report · <b>${esc(M.anchor_university)}</b></span><span>${esc(M.city)}, ${esc(M.state_abbr)} · ${asOfText}</span></div>`;

  const kpiCards = (list) => list.map((k) => `<div class="kpi"><div class="kpi-label">${k.l}</div><div class="kpi-value ${k.cls || ""}">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join("");
  const perfLegend = `<div class="legend"><span><i style="background:${PERF.anchor}"></i>This market</span><span><i style="background:${PERF.bench}"></i>Subtext-30 avg</span><span><i style="background:${PERF.power4}"></i>Power 4 avg</span></div>`;

  const kpis = [
    { l: "Existing Beds", v: fmtInt(M.existing_beds), s: "purpose-built" },

    { l: "Occupancy", v: fmtPct1(M.occupancy), s: "bed-weighted" },

  const qualRows = quals ? quals.results.map((r) => {

  const scorePct = quals && quals.evaluable > 0 ? Math.round((quals.passes / quals.evaluable) * 100) : null;
  const fwdDrivers = [

  // Student profile rows
  const ug = uinfo ? (uinfo.enr_ft_undergrad || 0) + (uinfo.enr_pt_undergrad || 0) : 0;

  const inCt = (inPct != null && ug) ? Math.round(inPct * ug) : null, outCt = (outPct != null && ug) ? Math.round(outPct * ug) : null;

  const profRows = uinfo ? [
    `<tr><td class="lbl">In-State</td><td class="val">${inCt == null ? "-" : fmtInt(inCt)} · ${fmtPct1(inPct)}</td>${tcell("&lt;90%", tEval(inPct, inPct != null && inPct < 0.90))}</tr>`,

  // Comp table + aggregates

  // ----- Unit & Bed Mix (by units) across the comp set, mirroring the dashboard -----
  const UNIT_MIX_TYPES = ["Studio", "1BR", "2BR", "3BR", "4BR", "5BR", "6BR+"];

  const UNIT_MIX_PALETTE = ["#16352e", "#a95818", "#4f7a6f", "#c7973f", "#6d5b8e", "#3d8aa6", "#8c6d46", "#9c4a3c", "#5a8c4a", "#b0894d", "#42606d", "#7a4f63"];
  const PARITY_COLORS = { full: "#16352e", partial: "#a95818" };

  const mixDatasets = mixComps.map(({ prop, mix }, i) => {

  const mixStackTotals = mixTypesPresent.map((t, ti) => mixDatasets.reduce((s, ds) => s + (ds.data[ti] || 0), 0));
  // Average unit size by exact unit type: units-weighted across the comp set.

    a.sf += e.avg_sf * e.units; a.units += e.units;
  }));
  const sizeCats = Object.keys(sizeAgg).map((label) => ({ label, ...sizeAgg[label] })).filter((a) => a.units > 0)
    .sort((x, y) => (x.beds - y.beds) || ((x.baths ?? -1) - (y.baths ?? -1)))
    .map((a) => ({ label: a.label, color: UNIT_TYPE_COLORS[a.cat] || "#837c75", value: Math.round(a.sf / a.units), units: a.units }));
  // Parity by type (units): full = en-suite, partial = shared bath. Feeds both doughnuts.
  const mixPerType = {};
  mixComps.forEach(({ mix }) => UNIT_MIX_TYPES.forEach((t) => {
    const e = (mix.parity_by_type || {})[t]; if (!e) return;
    const slot = mixPerType[t] || (mixPerType[t] = { full: 0, partial: 0 });
    slot.full += e.units_full || 0; slot.partial += e.units_partial || 0;
  }));
  const parityFull = Object.values(mixPerType).reduce((s, v) => s + v.full, 0);
  const parityPartial = Object.values(mixPerType).reduce((s, v) => s + v.partial, 0);

  // ----- Competitive Set detail tables (per-year leasing history, scoped to comps) -----
  const DT_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const compKeySet = new Set(comps.map((p) => p.property_key));
  const compHist = propHist.filter((r) => compKeySet.has(r.property_key));
  const dYears = [...new Set(compHist.map((r) => Number(r.year_)))].sort((a, b) => a - b).slice(-5);
  const hLook = {};
  compHist.forEach((r) => { const k = r.property_key, y = Number(r.year_); (hLook[k] = hLook[k] || {})[y] = r; });
  let dMonth = "";
  if (compHist.length) { const iso = compHist[0].data_as_of; if (typeof iso === "string" && iso.length >= 7) { const mm = Number(iso.slice(5, 7)); if (mm >= 1 && mm <= 12) dMonth = DT_MONTHS[mm - 1]; } }
  const dAnchor = (lbl) => dMonth ? `${lbl} (${dMonth})` : lbl;
  const bedW = (rows, f) => { let n = 0, d = 0; rows.forEach((r) => { if (r && r[f] != null && r.beds != null) { n += Number(r[f]) * Number(r.beds); d += Number(r.beds); } }); return d > 0 ? n / d : null; };
  const grow = (c, p) => (c == null || p == null || p === 0) ? null : (c - p) / p;
  const gCell = (g) => `<td class="${g == null ? "" : g >= 0 ? "up" : "down"}">${g == null ? "" : fmtSigned(g)}</td>`;
  const dHeadCells = `<th>Property</th><th>Built</th><th>Mi</th><th>Beds</th>${dYears.map((y) => `<th>${y}</th>`).join("")}`;
  const dMetaCells = (p) => `<td>${p.yearBuilt ?? "-"}</td><td>${p.milesToClosestCampus != null ? p.milesToClosestCampus.toFixed(1) : "-"}</td><td>${fmtInt(p.beds)}</td>`;
  const DT_LBLSPAN = 4;
  const dEmpty = `<tr><td colspan="${DT_LBLSPAN + dYears.length}">No comp-set leasing history on file.</td></tr>`;

  // Effective rent / bed by year + bed-weighted average with YoY / 2-Yr / 3-Yr growth
  const dRentAvg = {};
  dYears.forEach((y) => { dRentAvg[y] = bedW(comps.map((p) => hLook[p.property_key]?.[y]).filter(Boolean), "avg_rent_per_bed"); });
  const dRatesTable = `
    <table class="dt">
      <thead><tr>${dHeadCells}</tr></thead>
      <tbody>${comps.length ? comps.map((p) => `<tr><td>${esc(p.property_name || "(unnamed)")}</td>${dMetaCells(p)}${dYears.map((y) => { const r = hLook[p.property_key]?.[y]; return `<td>${r && r.avg_rent_per_bed ? fmtUsd(r.avg_rent_per_bed) : "-"}</td>`; }).join("")}</tr>`).join("") : dEmpty}</tbody>
      ${comps.length ? `<tfoot>
        <tr><td colspan="${DT_LBLSPAN}">Avg Rent / Bed</td>${dYears.map((y) => `<td>${fmtUsd(dRentAvg[y])}</td>`).join("")}</tr>
        <tr class="gr"><td colspan="${DT_LBLSPAN}">YoY Growth</td>${dYears.map((y, i) => i === 0 ? "<td></td>" : gCell(grow(dRentAvg[y], dRentAvg[dYears[i - 1]]))).join("")}</tr>
        <tr class="gr"><td colspan="${DT_LBLSPAN}">2-Yr Growth</td>${dYears.map((y, i) => i < 2 ? "<td></td>" : gCell(grow(dRentAvg[y], dRentAvg[dYears[i - 2]]))).join("")}</tr>
        <tr class="gr"><td colspan="${DT_LBLSPAN}">3-Yr Growth</td>${dYears.map((y, i) => i < 3 ? "<td></td>" : gCell(grow(dRentAvg[y], dRentAvg[dYears[i - 3]]))).join("")}</tr>
      </tfoot>` : ""}
    </table>`;

  // Per-property rent growth (YoY) + average of property-level growths
  const dRgYear = Object.fromEntries(dYears.map((y) => [y, []]));
  const dRgBody = comps.map((p) => {
    const cells = dYears.map((y, i) => {
      if (i === 0) return "<td></td>";
      const g = grow(hLook[p.property_key]?.[y]?.avg_rent_per_bed, hLook[p.property_key]?.[dYears[i - 1]]?.avg_rent_per_bed);
      if (g != null) dRgYear[y].push(g);
      return gCell(g);
    }).join("");
    return `<tr><td>${esc(p.property_name || "(unnamed)")}</td>${dMetaCells(p)}${cells}</tr>`;
  }).join("");
  const dRgAvg = dYears.map((y, i) => { if (i === 0) return "<td></td>"; const gs = dRgYear[y]; if (!gs.length) return "<td></td>"; return gCell(gs.reduce((s, x) => s + x, 0) / gs.length); }).join("");
  const dRentGrowthTable = `
    <table class="dt">
      <thead><tr>${dHeadCells}</tr></thead>
      <tbody>${comps.length ? dRgBody : dEmpty}</tbody>
      ${comps.length ? `<tfoot><tr><td colspan="${DT_LBLSPAN}">Average Growth</td>${dRgAvg}</tr></tfoot>` : ""}
    </table>`;

  // Pre-lease / occupancy by year + bed-weighted average with YoY / 2-Yr growth
  const dPctTable = (field) => {
    const avg = {};
    dYears.forEach((y) => { avg[y] = bedW(comps.map((p) => hLook[p.property_key]?.[y]).filter(Boolean), field); });
    const lbl = field === "prelease" ? "Average Pre-lease" : "Average Occupancy";
    return `
    <table class="dt">
      <thead><tr>${dHeadCells}</tr></thead>
      <tbody>${comps.length ? comps.map((p) => `<tr><td>${esc(p.property_name || "(unnamed)")}</td>${dMetaCells(p)}${dYears.map((y) => { const r = hLook[p.property_key]?.[y]; return `<td>${r && r[field] != null ? fmtPct0(r[field]) : "-"}</td>`; }).join("")}</tr>`).join("") : dEmpty}</tbody>
      ${comps.length ? `<tfoot>
        <tr><td colspan="${DT_LBLSPAN}">${lbl}</td>${dYears.map((y) => `<td>${fmtPct1(avg[y])}</td>`).join("")}</tr>
        <tr class="gr"><td colspan="${DT_LBLSPAN}">YoY Growth</td>${dYears.map((y, i) => i === 0 ? "<td></td>" : gCell(grow(avg[y], avg[dYears[i - 1]]))).join("")}</tr>
        <tr class="gr"><td colspan="${DT_LBLSPAN}">2-Yr Growth</td>${dYears.map((y, i) => i < 2 ? "<td></td>" : gCell(grow(avg[y], avg[dYears[i - 2]]))).join("")}</tr>
      </tfoot>` : ""}

  };
  const dPreleaseTable = dPctTable("prelease");
  const dOccupancyTable = dPctTable("occupancy");

  // Fundamentals metric/scope definitions
  const METRICS = [
    { key: "rent", field: "avg_rent_per_bed", title: "Market Rent", unit: "per bed", growth: false, pct: false },
    { key: "growth", field: "avg_rent_per_bed", title: "Market Rate Growth", unit: "year-over-year", growth: true, pct: false },
    { key: "occ", field: "occupancy", title: "Market Occupancy", unit: "bed-weighted", growth: false, pct: true },
    { key: "prelease", field: "prelease", title: "Market Pre-lease", unit: "latest cycle", growth: false, pct: true },

  const SCOPES = [{ id: "market", l: "Total Market" }, { id: "1mi", l: "Within 1 Mile" }, { id: "0.5mi", l: "Within ½ Mile" }, { id: "1mi2015", l: "Within 1 Mile · 2015+" }];
  const fundSheet = (m, page) => `

  /* ---- render ---- */
  document.getElementById("report-root").innerHTML = `

  </div>

  ${fundSheet(METRICS[0], 3)}

  <div class="sheet">
    ${runHead}
    ${mainHead("04", "Supply Pipeline", `${fmtInt(M.beds_pipeline_total)} pipeline beds · ${pipePct != null ? fmtPct1(pipePct) : "-"} of existing`)}
    <div class="sub">Pipeline by Phase</div>

      <div class="kpi"><div class="kpi-label">Existing</div><div class="kpi-value">${fmtInt(M.existing_beds)}</div><div class="kpi-sub">stabilized beds</div></div>
      <div class="kpi"><div class="kpi-label">Lease-up</div><div class="kpi-value">${fmtInt(M.beds_lease_up)}</div><div class="kpi-sub">delivering now</div></div>
      <div class="kpi"><div class="kpi-label">Under Construction</div><div class="kpi-value">${fmtInt(M.beds_under_construction)}</div><div class="kpi-sub">≈ 6-24 months</div></div>
      <div class="kpi"><div class="kpi-label">Planned</div><div class="kpi-value">${fmtInt(M.beds_planned)}</div><div class="kpi-sub">permitted / announced</div></div>

        afterDatasetsDraw(chart) {
          const { ctx } = chart; const meta = chart.getDatasetMeta(0); if (!meta || !meta.data) return;
          ctx.save(); ctx.fillStyle = C.everest; ctx.textAlign = "center"; ctx.font = "700 8px Pragmatica, sans-serif";
          meta.data.forEach((bar, i) => { if (vals[i]) ctx.fillText(fmtInt(vals[i]) + " SF", bar.x, bar.y - 4); });
          ctx.restore();
        },
      };
      new Chart(sizeEl.getContext("2d"), {
        type: "bar",
        data: { labels: sizeCats.map((c) => c.label), datasets: [{ label: "Avg SF", data: vals, backgroundColor: sizeCats.map((c) => c.color), borderColor: "#fff", borderWidth: 1, borderRadius: 1 }] },
        options: baseOpts({
          layout: { padding: { top: 16 } },
          plugins: { legend: { display: false }, tooltip: { enabled: false }, datalabels: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: C.slate, font: { size: 7.5, weight: 600 }, maxRotation: 35, minRotation: 0 } },
            y: { beginAtZero: true, title: { display: true, text: "Square Feet", color: C.slate70, font: { size: 8 } }, grid: { color: "rgba(0,0,0,0.05)" }, ticks: { color: C.slate70, font: { size: 8 } } },
          },
        }),
        plugins: [sizeTotals],
      });
    }

    // Comp Set Mix nested doughnut: inner = bedroom type, outer = en-suite vs shared bath.
    const pieEl = document.getElementById("ch-umix-pie");
    const mixTypes = UNIT_MIX_TYPES.filter((t) => mixPerType[t] && (mixPerType[t].full + mixPerType[t].partial) > 0);
    const mixTotal = mixTypes.reduce((s, t) => s + mixPerType[t].full + mixPerType[t].partial, 0);
    if (pieEl && mixTotal) {
      const innerData = mixTypes.map((t) => mixPerType[t].full + mixPerType[t].partial);
      const innerColors = mixTypes.map((t) => UNIT_TYPE_COLORS[t] || "#837c75");
      const outerData = [], outerColors = [], outerMeta = [];
      mixTypes.forEach((t) => {
        const base = UNIT_TYPE_COLORS[t] || "#837c75";
        outerData.push(mixPerType[t].full); outerColors.push(base); outerMeta.push({ kind: "en-suite" });
        outerData.push(mixPerType[t].partial); outerColors.push(base + "80"); outerMeta.push({ kind: "shared bath" });
      });
      new Chart(pieEl.getContext("2d"), {
        type: "doughnut",
        data: { labels: mixTypes, datasets: [
          { data: innerData, backgroundColor: innerColors, borderColor: "#fff", borderWidth: 2,
            datalabels: { color: "#fff", font: { weight: 700, size: 7.5, family: "Pragmatica, sans-serif" }, formatter: (v, ctx) => (v / mixTotal * 100) < 7 ? "" : mixTypes[ctx.dataIndex] } },
          { data: outerData, backgroundColor: outerColors, borderColor: "#fff", borderWidth: 2,
            datalabels: { color: C.slate, font: { weight: 700, size: 7, family: "Pragmatica, sans-serif" }, formatter: (v, ctx) => { if (outerMeta[ctx.dataIndex].kind !== "shared bath") return ""; const pct = v / mixTotal * 100; return pct < 5 ? "" : pct.toFixed(0) + "%"; } } },
        ] },
        options: baseOpts({
          cutout: "40%", layout: { padding: 4 },
          plugins: { legend: { display: true, position: "right", labels: { font: { size: 8 }, boxWidth: 10, boxHeight: 10, padding: 5 } }, tooltip: { enabled: false } },
        }),
        plugins: [ChartDataLabels],
      });
    }

    // Bed/Bath parity doughnut (units): full parity vs shared baths across the comp set.
    const parEl = document.getElementById("ch-umix-parity");
    const parTotal = parityFull + parityPartial;
    if (parEl && parTotal) {
      new Chart(parEl.getContext("2d"), {
        type: "doughnut",
        data: { labels: ["Full parity", "No parity"], datasets: [{ data: [parityFull, parityPartial], backgroundColor: [PARITY_COLORS.full, PARITY_COLORS.partial], borderColor: "#fff", borderWidth: 2 }] },
        options: baseOpts({
          cutout: "52%", layout: { padding: 4 },
          plugins: { legend: { display: true, position: "right", labels: { font: { size: 8 }, boxWidth: 10, boxHeight: 10, padding: 5 } }, tooltip: { enabled: false },
            datalabels: { color: "#fff", font: { weight: 700, size: 8, family: "Pragmatica, sans-serif" }, formatter: (v) => { const pct = v / parTotal * 100; return pct < 6 ? "" : pct.toFixed(0) + "%"; } } },
        }),
        plugins: [ChartDataLabels],
      });
    }
  }

  /* ---- maps via comp-map.js: market-wide (all props) for overview, comps for comp set ---- */
  window.MARKET = M;
  window.PROPERTIES = props;
  window.CAMPUSES = (T.campus_locations || []).filter((c) => c.market_key === marketKey);
  const PHASE_STYLES = {
    "stable": { shape: "diamond", color: "#16352e", label: "Stabilized" },
    "lease up": { shape: "square", color: "#c1d100", label: "Lease Up" },
    "under construction": { shape: "triangle", color: "#a95818", label: "Under Construction" },
    "planned": { shape: "pentagon", color: "#5a544f", label: "Planned" },
  };
  window.phaseStyle = (phase) => PHASE_STYLES[(phase || "").toLowerCase()] || { shape: "circle", color: "#b6b1ab", label: "Unknown" };
  const renderMap = async (selection, imgId) => {
    if (!window.CompMap || selection.size === 0) return;
    window.compSelection = selection;
    if (window.CompMap.configure) window.CompMap.configure({ compact: true });  // name + address callouts, no stats
    await window.CompMap.refresh();
    const cv = document.getElementById("comp-map-canvas"), img = document.getElementById(imgId);
    if (cv && img) img.src = cv.toDataURL("image/png");
  };
  (async () => {
    try {
      await renderMap(new Set(comps.map((p) => p.property_key)), "report-comp-map");      // comp set
    } catch (e) { /* maps optional */ }
  })();
});

function fail(msg) { document.getElementById("report-loading").textContent = msg; }
</script>
</body>
</html>
